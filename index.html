<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <!-- 1. LA LÍNEA MÁGICA: Adapta el tamaño a la pantalla del móvil y evita el efecto "mini web" -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- 2. ETIQUETAS EXCLUSIVAS PARA IPHONE: Le dan aspecto de app nativa -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mis Notas" />

  <title>Mi Lista de Tareas</title>
  <meta name="description" content="Mi aplicación personal para gestionar tareas y notas en la nube." />
  
  <!-- Enlazamos los archivos CSS por separado para mantener el orden.
       El orden aquí es importante: los estilos específicos (tareas/notas) 
       tienen más peso si se cargan después de los base. -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" /> <!-- NUEVO: Estilos del login -->
  <link rel="stylesheet" href="css/tareas.css" />
  <link rel="stylesheet" href="css/notas.css" />

  <!-- Enlaces PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4caf50" />

</head>

<body>
    <!-- Barra superior fija: Contiene el interruptor de modo claro/oscuro.
         Usamos un contenedor con botones para el switch del tema. -->
    <div class="page-top-bar">
      <!-- NUEVO: Botón de cerrar sesión (oculto por defecto) -->
      <button id="logout-button" class="logout-btn hidden">Cerrar sesión</button>
        <div class="theme-toggle-wrapper">
          <span class="theme-label theme-label-light">☀️ Claro</span>
          <button id="theme-toggle-button" class="theme-toggle" aria-label="Cambiar entre modo claro y modo oscuro">
            <span class="theme-toggle-knob"></span>
          </button>
          <span class="theme-label theme-label-dark">🌙 Oscuro</span>
        </div>
    </div>

     <!-- NUEVO: VISTA DE AUTENTICACIÓN (Login / Registro) -->
     <div id="auth-view" class="auth-container">
      
      <!-- Formulario de Iniciar Sesión -->
      <form id="login-form" class="auth-form">
        <h1>Iniciar Sesión</h1>
        <p class="auth-subtitle">Accede a tus tareas y notas en la nube</p>
        
        <input type="email" id="login-email" placeholder="Correo electrónico" required />
        <input type="password" id="login-password" placeholder="Contraseña" required />
        
        <button type="submit" class="auth-submit-btn">Entrar</button>
        
        <p class="auth-switch-text">
          ¿No tienes cuenta? <a href="#" id="show-register">Regístrate aquí</a>
        </p>
      </form>

      <!-- Formulario de Registro (Oculto por defecto) -->
      <form id="register-form" class="auth-form hidden">
        <h1>Crear Cuenta</h1>
        <p class="auth-subtitle">Únete para no perder nunca tus datos</p>
        
        <input type="email" id="register-email" placeholder="Correo electrónico" required />
        <input type="password" id="register-password" placeholder="Contraseña (mín. 6 caracteres)" required minlength="6"/>
        
        <button type="submit" class="auth-submit-btn">Registrarme</button>
        
        <p class="auth-switch-text">
          ¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión</a>
        </p>
      </form>
    </div>

    <!-- MENÚ SPA (Ahora oculto por defecto con la clase 'hidden') -->
    <nav id="main-nav" class="sub-nav hidden" aria-label="Navegación principal">
      <button type="button" class="sub-nav-btn active" data-tab="tareas">Tareas</button>
      <button type="button" class="sub-nav-btn" data-tab="notas">Notas</button>
    </nav>

      <!-- APP PRINCIPAL (Ahora oculta por defecto con la clase 'hidden' y un ID nuevo) -->
    <main id="main-app-view" class="app-container hidden">
      
      <!-- VISTA DE TAREAS: Esta sección se muestra por defecto.
           Contiene el input de texto, el botón de añadir y los botones de filtro. -->
      <div id="tareas-view">
        <h1>Lista de Tareas</h1>
        <div class="input-section">
          <input id="task-input" type="text" placeholder="Escribe una tarea y pulsa Enter o el botón Añadir..." />
          <button id="add-button" type="button">Añadir</button>
        </div>
        
        <!-- Barra de filtros: Controla qué tareas se muestran (todas/pendientes/completadas) -->
        <div class="filter-bar">
          <button type="button" class="filter-btn active" data-filter="all">Todas</button>
          <button type="button" class="filter-btn" data-filter="pending">Pendientes</button>
          <button type="button" class="filter-btn" data-filter="completed">Completadas</button>
        </div>
        
        <!-- Lista de tareas: Aquí JavaScript inyectará dinámicamente los elementos <li> -->
        <ul id="task-list">
          <!-- Las tareas se añaden aquí mediante JavaScript -->
        </ul>
      </div>

      <!-- VISTA DE NOTAS: Esta vista tiene la clase 'hidden' por defecto en CSS,
           y JavaScript la quitará cuando el usuario pulse el botón "Notas". -->
      <div id="notas-view" class="hidden">
        <h1>Notas</h1>
        <div class="notes-inputs">
          <input id="note-title" type="text" placeholder="Título de la nota" />
          <textarea id="note-content" rows="4" placeholder="Escribe aquí el contenido de la nota..."></textarea>
          <button id="save-note-button" type="button">Añadir nota</button>
        </div>
        
        <!-- Cuadrícula de notas: Aquí aparecerán los post-its generados -->
        <div id="notes-grid" class="notes-grid">
          <!-- Las tarjetas de notas se generan aquí -->
        </div>
      </div>
    </main>

  <!-- Scripts: Cargamos los archivos JS al final para asegurar que 
       el navegador ya ha dibujado todo el HTML antes de empezar a manipularlo. -->
  <script type="module" src="js/auth.js"></script> <!-- NUEVO: Lógica del login -->
  <script type="module" src="js/app.js"></script>    <!-- Lógica de navegación y temas -->
  <script type="module" src="js/tareas.js"></script> <!-- Lógica exclusiva de tareas -->
  <script type="module" src="js/notas.js"></script>  <!-- Lógica exclusiva de notas -->
</body>
</html>
